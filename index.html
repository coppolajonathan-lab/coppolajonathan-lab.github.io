<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jonathan Coppola, MS</title>
<meta name="description" content="Jonathan Coppola: technical curriculum developer and program manager at Darktrace, baritenor in Tampa Bay community theater, and tabletop game master.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e7; --paper-2: #efe7d7; --ink: #1d1a17; --muted: #6b6359;
    --wine: #7a1f2b; --gold: #b08d4a; --line: #d9cdb6;
    --serif: "Fraunces", Georgia, serif; --sans: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.6; }
  a { color: var(--wine); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 24px; }


  header.hero { padding: 72px 0 48px; text-align: center; border-bottom: 3px double var(--gold); }
  .kicker { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  h1 { font-family: var(--serif); font-weight: 800; font-size: clamp(44px, 8vw, 84px); line-height: 1; margin: 14px 0 8px; letter-spacing: -0.02em; }
  h1 small { font-size: .38em; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .headline { font-family: var(--serif); font-style: italic; font-size: clamp(17px, 2.4vw, 21px); color: var(--wine); margin: 6px 0 22px; }
  .intro { max-width: 680px; margin: 0 auto 28px; color: #3a342e; font-size: 17px; }
  .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--ink); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; }
  .btn.solid { background: var(--wine); border-color: var(--wine); color: #fff; }
  .btn:hover { transform: translateY(-1px); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 40px 0 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat { padding: 18px 10px; text-align: center; border-right: 1px solid var(--line); }
  .stat:last-child { border-right: 0; }
  .stat b { display: block; font-family: var(--serif); font-size: 34px; font-weight: 800; color: var(--wine); line-height: 1.1; }
  .stat span { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }

  section { padding: 64px 0 24px; scroll-margin-top: 60px; }
  .jump { margin: 18px 0 0; font-size: 14px; color: var(--muted); }
  .jump a { color: var(--muted); }
  .act { display: flex; align-items: baseline; gap: 16px; margin-bottom: 26px; }
  .act .num { font-family: var(--serif); font-style: italic; color: var(--gold); font-size: 18px; white-space: nowrap; }
  .act h2 { font-family: var(--serif); font-weight: 800; font-size: clamp(30px, 4.5vw, 42px); margin: 0; line-height: 1.1; }
  .act .rule { flex: 1; height: 1px; background: var(--line); }
  .lede { font-size: 17px; color: #3a342e; max-width: 760px; }

  .job { display: grid; grid-template-columns: 200px 1fr; gap: 24px; padding: 22px 0; border-top: 1px solid var(--line); }
  .job .co { font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.2; }
  .job .loc { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .role + .role { margin-top: 18px; }
  .role h3 { margin: 0; font-size: 16px; }
  .role .dates { font-size: 13px; color: var(--wine); font-weight: 600; margin: 2px 0 6px; }
  .role ul { margin: 6px 0 0; padding-left: 18px; }
  .role li { margin: 4px 0; }

  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; margin-top: 28px; }
  .panel { background: var(--paper-2); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; }
  .panel h4 { margin: 0 0 10px; font-family: var(--serif); font-size: 19px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); }
  .edu p, .pub p { margin: 4px 0; }
  .edu .deg, .pub .t { font-weight: 600; }
  .edu .meta, .pub .meta { font-size: 13px; color: var(--muted); }
  .edu > div + div, .pub > div + div { margin-top: 14px; }

  /* Stage: playbill styling */
  .playbill { background: var(--ink); color: #f3ead7; border-radius: 16px; padding: 34px; position: relative; overflow: hidden; }
  .playbill::before { content: ""; position: absolute; inset: 10px; border: 1px solid color-mix(in srgb, var(--gold) 60%, transparent); border-radius: 10px; pointer-events: none; }
  .playbill .voice { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
  .playbill h3 { font-family: var(--serif); font-size: 28px; margin: 6px 0 14px; }
  .playbill p { color: #dcd2bd; max-width: 640px; }
  .credits { width: 100%; border-collapse: collapse; margin: 18px 0 6px; font-size: 15px; }
  .credits td { padding: 10px 6px; border-bottom: 1px dotted color-mix(in srgb, var(--gold) 50%, transparent); }
  .credits td:first-child { font-family: var(--serif); font-style: italic; font-size: 18px; }
  .credits td:last-child { text-align: right; color: #bfb39b; font-size: 13px; }
  .pb-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 22px; }
  .pb-grid h5 { margin: 0 0 6px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
  .pb-grid p { margin: 0; font-size: 14px; }

  .campaign { border-left: 4px solid var(--wine); padding: 4px 0 4px 16px; }
  .campaign + .campaign { margin-top: 18px; }
  .campaign b { font-family: var(--serif); font-size: 20px; }
  .campaign .sys { font-size: 13px; color: var(--muted); }

  .curtain { margin-top: 64px; padding: 40px 0 60px; border-top: 3px double var(--gold); text-align: center; }
  .curtain h2 { font-family: var(--serif); font-size: 30px; margin: 0 0 10px; }
  .also { list-style: none; padding: 0; margin: 18px auto 0; max-width: 620px; text-align: left; }
  .also li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .fine { font-size: 12px; color: var(--muted); margin-top: 26px; }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat:nth-child(2) { border-right: 0; }
    .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    .job { grid-template-columns: 1fr; gap: 8px; }
    .playbill { padding: 26px 20px; }
  }
  @media print { .links, .curtain .also { display: none; } body { background: #fff; } section { padding-top: 24px; } }
</style>
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-root="" data-section="home">

<div class="wrap">
  <header class="hero">
    <div class="kicker" id="loc"></div>
    <h1 id="name"></h1>
    <p class="headline" id="headline"></p>
    <p class="intro" id="intro"></p>
    <div class="links" id="links"></div>
    <div class="stats" id="stats"></div>
    <p class="jump"><a href="#work">The Day Job</a> · <a href="#stage">The Stage</a> · <a href="#table">The Table</a> · <a href="#contact">Contact</a></p>
  </header>

  <section id="work">
    <div class="act"><span class="num">Act I</span><h2>The Day Job</h2><span class="rule"></span></div>
    <p class="lede" id="summary"></p>
    <div id="jobs"></div>
    <div class="cols">
      <div class="panel"><h4>Core competencies</h4><div id="skills"></div></div>
      <div class="panel edu"><h4>Education</h4><div id="edu"></div></div>
      <div class="panel pub"><h4>Publications</h4><div id="pubs"></div></div>
    </div>
  </section>

  <section id="stage">
    <div class="act"><span class="num">Act II</span><h2>The Stage</h2><span class="rule"></span></div>
    <div class="playbill">
      <div class="voice" id="voice"></div>
      <h3>Jonathan Coppola</h3>
      <p id="stageBlurb"></p>
      <table class="credits"><tbody id="credits"></tbody></table>
      <div class="pb-grid" id="pbgrid"></div>
    </div>
  </section>

  <section id="table">
    <div class="act"><span class="num">Act III</span><h2>The Table</h2><span class="rule"></span></div>
    <p class="lede" id="tableBlurb"></p>
    <div class="cols">
      <div class="panel"><h4>Campaigns</h4><div id="campaigns"></div></div>
      <div class="panel"><h4>Tools of the trade</h4><div id="tools"></div></div>
    </div>
  </section>

  <section class="curtain" id="contact">
    <h2>Curtain Call</h2>
    <div class="links" id="links2"></div>
    <ul class="also" id="also"></ul>
    <p class="fine">© <span id="yr"></span> Jonathan Coppola · Tampa, FL</p>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data/profile.json').then(r => r.json()).then(p => {
  document.title = `${p.name}, ${p.credential}`;
  $('loc').textContent = p.location;
  $('name').innerHTML = `${esc(p.name)} <small>${esc(p.credential)}</small>`;
  $('headline').textContent = p.headline;
  $('intro').textContent = p.intro;
  const links = `<a class="btn solid" href="mailto:${esc(p.email)}">Email me</a>
    <a class="btn" href="${esc(p.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>
    <a class="btn" href="${esc(p.github)}" target="_blank" rel="noopener">GitHub</a>`;
  $('links').innerHTML = links; $('links2').innerHTML = links;
  $('stats').innerHTML = p.stats.map(s => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('');

  $('summary').textContent = p.summary;
  $('jobs').innerHTML = p.experience.map(j => `<div class="job">
    <div><div class="co">${esc(j.company)}</div><div class="loc">${esc(j.location)}</div></div>
    <div>${j.roles.map(r => `<div class="role"><h3>${esc(r.title)}</h3><div class="dates">${esc(r.dates)}</div>
      <ul>${r.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>`).join('')}</div></div>`).join('');
  $('skills').innerHTML = p.skills.map(g => `<p style="margin:10px 0 6px;font-size:13px;font-weight:600;color:var(--muted)">${esc(g.group)}</p>
    <div class="tags">${g.items.map(i => `<span class="tag">${esc(i)}</span>`).join('')}</div>`).join('');
  $('edu').innerHTML = p.education.map(e => `<div><p class="deg">${esc(e.degree)}</p><p>${esc(e.school)} · ${esc(e.year)}</p><p class="meta">${esc(e.notes)}</p></div>`).join('');
  $('pubs').innerHTML = p.publications.map(x => `<div><p class="t">${esc(x.title)}</p><p class="meta">${esc(x.venue)} · ${esc(x.date)}</p><p>${esc(x.summary)}</p><p class="meta">${esc(x.authors)}</p></div>`).join('');

  const s = p.stage;
  $('voice').textContent = s.voice;
  $('stageBlurb').textContent = s.blurb;
  $('credits').innerHTML = s.credits.map(c => `<tr><td>${esc(c.show)}</td><td>${esc(c.role)}</td><td>${esc(c.company)} · dir. ${esc(c.director)} · ${esc(c.year)}</td></tr>`).join('');
  $('pbgrid').innerHTML = `
    <div><h5>Training</h5>${s.training.map(t => `<p><b>${esc(t.what)}</b>: ${esc(t.detail)}</p>`).join('')}</div>
    <div><h5>Dialects</h5><p>${s.dialects.map(esc).join(' · ')}</p></div>
    <div><h5>Instruments</h5><p>${s.instruments.map(esc).join(' · ')}</p></div>
    <div><h5>At a glance</h5>${Object.entries(s.stats).map(([k, v]) => `<p>${esc(k)}: ${esc(v)}</p>`).join('')}</div>`;

  $('tableBlurb').textContent = p.tabletop.blurb;
  $('campaigns').innerHTML = p.tabletop.campaigns.map(c => `<div class="campaign"><b>${esc(c.name)}</b><div class="sys">${esc(c.role)} · ${esc(c.system)}</div><p style="margin:6px 0 0">${esc(c.pitch)}</p></div>`).join('');
  $('tools').innerHTML = p.tabletop.tools.map(t => `<p><a href="${esc(t.url)}"${/^https?:/.test(t.url) ? ' target="_blank" rel="noopener"' : ''}>${esc(t.label)}</a>: ${esc(t.note)}</p>`).join('');

  $('also').innerHTML = p.also.map(a => `<li><a href="${esc(a.url)}"${/^https?:/.test(a.url) ? ' target="_blank" rel="noopener"' : ''}>${esc(a.label)}</a>: ${esc(a.note)}</li>`).join('');
  $('yr').textContent = new Date().getFullYear();
});
</script>
<script src="assets/site.js"></script>
</body>
</html>
